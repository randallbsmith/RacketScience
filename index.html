<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Racket Science!</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f4f7f5;
    color: #243c32;
    font: 14px system-ui, sans-serif;
  }

  main {
    max-width: 1600px;
    margin: auto;
    padding: 24px;
  }

  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
    margin-bottom: 8px;
  }

  h1 {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 49px;
    margin: 0;
    color: #279da8;
    font-style: italic;
  }

  h1 img {
    width: auto;
    height: 66px;
    object-fit: contain;
  }

  .hint {
    color: #5b7066;
    font-size: 12px;
  }

  .current-date {
    margin: 0;
    font-size: 35px;
    font-weight: 700;
  }

  .scroll {
    overflow-x: auto;
    background: white;
    border: 1px solid #cbd9d0;
    border-radius: 10px;
  }

  table {
    border-collapse: collapse;
    width: 100%;
  }

  th {
    padding: 8px;
    text-align: left;
    background: #e8f1eb;
    font-size: 12px;
  }

  td {
    padding: 0;
    text-align: left;
  }

  /* Player and Playing? columns hug their content; Comments takes the remaining width */
  th:nth-child(-n+2), td:nth-child(-n+2) { width: 1%; white-space: nowrap; }

  input, textarea {
    font: inherit;
    color: inherit;
    padding: 8px;
    border: 1px solid #c3d1c8;
    background: white;
    width: 100%;
  }

  td > input {
    display: block;
    min-width: 180px;
    height: 38px;
    margin: 0;
    border-radius: 0;
  }

  input:focus-visible, textarea:focus-visible {
    outline: 3px solid #279da8;
    outline-offset: -3px;
  }

  fieldset {
    display: flex;
    gap: 0;
    border: 0;
    margin: 0;
    padding: 0;
    height: 38px;
    white-space: nowrap;
  }

  fieldset label {
    border-top: 1px solid #c3d1c8;
    border-bottom: 1px solid #c3d1c8;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 6px;               /* trimmed to make room for the larger buttons without widening the column */
  }

  .yes { background: #e2f5e9; }
  .no { background: #ffeded; }
  .maybe { background: #fff7d9; }

  /* Yes / No / Maybe: glossy plastic domes in a chrome bead (no outer shadow) */
  input[type=radio] {
    --lite: #ffffff; --mid: #e9eef0; --dark: #b9c3c8;      /* unselected: frosted white plastic */
    appearance: none; -webkit-appearance: none;
    min-width: 0; width: 30px; height: 30px; margin: 0; flex: none;
    border-radius: 50%; border: 5.5px solid transparent; cursor: pointer;
    background:
      /* plastic dome + its highlight (inside the ring) */
      radial-gradient(circle at 50% 28%, rgba(255,255,255,.95) 0 16%, rgba(255,255,255,0) 46%) padding-box,
      radial-gradient(circle at 50% 75%, var(--lite) 0%, var(--mid) 55%, var(--dark) 100%) padding-box,
      /* chrome bead: a bright crest running round the middle of the ring (no dark outline) */
      radial-gradient(circle closest-side, transparent 0 60%, rgba(255,255,255,0) 66%,
                      rgba(255,255,255,.85) 77%, rgba(255,255,255,0) 89%) border-box,
      /* a glint where the light hits the top-left of the bead */
      radial-gradient(circle at 30% 14%, rgba(255,255,255,1) 0 8%, rgba(255,255,255,0) 20%) border-box,
      /* chrome lit from above: white top edge, shaded underside (like the contacts button) */
      linear-gradient(180deg, #ffffff 0%, #eef1f3 18%, #b9c0c6 42%, #8d959c 62%, #c3c9ce 80%, #9aa2a9 100%) border-box;
    /* the dome sits slightly recessed: soft shadow just under the ring's top inner lip */
    box-shadow: inset 0 2px 2px rgba(0,0,0,.28);
  }
  .yes   input[type=radio]:checked { --lite: #4cc46f; --mid: #11893a; --dark: #064a1d; }
  .no    input[type=radio]:checked { --lite: #ffb0a8; --mid: #e5483b; --dark: #9c1d14; }
  .maybe input[type=radio]:checked { --lite: #ffe79a; --mid: #f2b705; --dark: #a87800; }
  input[type=radio]:focus-visible { outline: 2px solid #218b96; outline-offset: 2px; }
  input[type=radio]:disabled { cursor: default; }

  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }

  .bottom {
    display: grid;
    grid-template-columns: var(--player-width, 180px) var(--attendance-width, 220px) minmax(240px, 1fr);
    gap: 0;
    margin: 0 0 24px;
  }

  /* Playing total: a raised plastic slab in a chrome bead, lit from above (no outer shadow) */
  .count {
    grid-column: 2;
    position: relative;
    padding: 20px 12px;
    text-align: center;
    border: 7px solid transparent;
    border-radius: 18px;
    color: #15707a;
    background:
      radial-gradient(ellipse 52% 26% at 50% 4%, rgba(255,255,255,.55) 0%, rgba(255,255,255,.35) 55%, rgba(255,255,255,0) 100%) padding-box,
      linear-gradient(180deg, #74d6de 0%, #47bfc9 38%, #2fa7b1 72%, #23909a 100%) padding-box,
      linear-gradient(180deg, #c3c9ce 0px, #eef1f3 3px, #b4bbc1 7px, #e9ecef 10%, #c9cfd4 30%, #b6bdc3 46%, #adb4ba 50%, #d3d8dc 58%, #aab1b7 80%, #e3e7ea 100%) border-box;
    box-shadow: inset 0 2px 1px rgba(255,255,255,.55), inset 0 -6px 12px rgba(0,45,50,.35);
  }
  .count::before {                  /* half-round chrome bead: shading across the band's width */
    content: ""; position: absolute; inset: -7px; border-radius: 18px; pointer-events: none;
    box-shadow:
      inset 0 2px 1px 0 rgba(255,255,255,.75),            /* top of the bead catches the light */
      inset 0 -2px 2px 0 rgba(40,46,52,.32),              /* underside of the bead falls into shade */
      inset 0 0 0 1px rgba(40,46,52,.12),                 /* outer edge rolls away (faint, no outline) */
      inset 0 0 1px 3.6px rgba(255,255,255,.62),          /* bright crest along the middle of the bead */
      inset 0 0 1px 5.4px rgba(40,46,52,.10),
      inset 0 0 0 7px rgba(40,46,52,.26);                 /* inner edge rolls down into shade */
  }
  .count::after {                   /* specular highlights on the bead, painted on top */
    content: ""; position: absolute; inset: -7px; border-radius: 18px; pointer-events: none;
    background:
      /* corner pickups where the rounded top corners catch the light */
      /* hot spot right at the outer curve, strongest at 45 degrees */
      radial-gradient(circle at 6.2px 6.2px, #fff 0 1.1px, rgba(255,255,255,.55) 2px, rgba(255,255,255,0) 4px),
      radial-gradient(circle at calc(100% - 6.2px) 6.2px, #fff 0 .8px, rgba(255,255,255,.45) 1.6px, rgba(255,255,255,0) 3.4px),
      /* thin bright arc tracing the outer edge of each top corner */
      radial-gradient(circle at 18px 18px, rgba(255,255,255,0) 0 15.4px, rgba(255,255,255,.95) 16.3px, rgba(255,255,255,0) 17.4px) left top / 18px 18px no-repeat,
      radial-gradient(circle at 0 18px, rgba(255,255,255,0) 0 15.4px, rgba(255,255,255,.75) 16.3px, rgba(255,255,255,0) 17.4px) right top / 18px 18px no-repeat,
      /* crisp specular line along the crest of the top edge, fading toward the ends */
      radial-gradient(ellipse 44% 1.3px at 50% 3.3px, #fff 0%, #fff 60%, rgba(255,255,255,0) 100%),
      /* softer glints running down the upper sides */
      radial-gradient(ellipse 1.2px 22% at 3.6px 28%, rgba(255,255,255,.95), rgba(255,255,255,0)),
      radial-gradient(ellipse 1.2px 18% at calc(100% - 3.6px) 26%, rgba(255,255,255,.8), rgba(255,255,255,0)),
      /* a faint bounce of light on the lower crest */
      radial-gradient(ellipse 36% 1px at 50% calc(100% - 3.6px), rgba(255,255,255,.55), rgba(255,255,255,0));
  }
  .count > * { position: relative; }

  /* Engraved text: cut into the plastic. Top inner edge in shadow, bottom inner edge catches the light. */
  .count-main span, .count strong, .count small, .count small b {
    color: #1a7d87;
    text-shadow: 0 -1px 1px rgba(0,40,46,.55), 0 1px 0 rgba(255,255,255,.55);
  }
  .count strong, .count small b {
    color: #177680;
    text-shadow: 0 -2px 2px rgba(0,35,40,.6), 0 2px 1px rgba(255,255,255,.6);
  }

  .count-main {
    display: flex;
    align-items: center;          /* label sits on the number's vertical centre */
    justify-content: center;
    gap: 10px;
  }

  .count-main span { font-size: 20px; font-weight: 600; }

  .count strong {
    font-size: 42px;
    line-height: 1;
  }

  .count small {
    display: block;
    margin-top: 8px;
    font-size: 16px;
    line-height: 1.4;
  }

  .count small[hidden] {
    display: none;
  }

  .count small b {
    display: block;
    font-size: 32px;
    font-weight: 700;
    line-height: 1.2;
  }

  .notes {
    grid-column: 3;
    margin-left: 20px;
    background: #fff3f3;
    border: 1px solid #e3bbbb;
    padding: 20px;
    border-radius: 10px;
  }

  .notes label {
    display: block;
    margin-bottom: 10px;
  }

  textarea {
    min-height: 130px;
    resize: vertical;
    border-radius: 5px;
  }

  .photos {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .photos img {
    height: 230px;
    width: auto;
    max-width: 100%;
    object-fit: contain;
    border-radius: 10px;
    display: block;
  }

  .contacts { margin: 0 0 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .contacts[hidden] { display: none; }
  /* Glossy 3D plastic button in a chrome bead */
  .contacts a.bezel {
    display: inline-block; padding: 4px; border-radius: 999px; text-decoration: none;
    background: linear-gradient(180deg,#fdfdfd 0%,#c9ced3 18%,#7d858c 45%,#eef1f3 52%,#a3aab0 70%,#e8ebed 88%,#8c939a 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 -1px 0 rgba(0,0,0,.25) inset;   /* no outer shadow */
    transition: transform .08s;
  }
  .contacts a.bezel:hover .gloss { filter: brightness(1.08); }
  .contacts a.bezel:active { transform: translateY(1px); }
  .contacts a.bezel:focus-visible { outline: 3px solid #f0b400; outline-offset: 3px; }
  .contacts .gloss {
    position: relative; display: inline-block; padding: 12px 26px; border-radius: 999px; overflow: hidden;
    color: #fff; font-weight: 800; font-size: 17px; letter-spacing: .2px; text-shadow: 0 1px 1px rgba(0,60,66,.7);
    background: radial-gradient(120% 140% at 50% 120%,#5fe3ec 0%,#2bb3bf 35%,#17808a 70%,#0f5f67 100%);
    box-shadow: inset 0 -6px 10px rgba(0,40,45,.45), inset 0 2px 3px rgba(255,255,255,.35);
  }
  .contacts .gloss::before {
    content: ""; position: absolute; left: 8%; right: 8%; top: 3px; height: 48%; border-radius: 999px;
    background: linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.12)); pointer-events: none;
  }
  .contacts .gloss::after {
    content: ""; position: absolute; left: 30%; right: 30%; bottom: 3px; height: 18%; border-radius: 999px;
    background: radial-gradient(closest-side,rgba(180,255,255,.55),transparent); pointer-events: none;
  }
  .contacts .gloss > span { position: relative; }

  /* Placeholder roster shown while the first load is in flight */
  tbody.loading { pointer-events: none; animation: rs-pulse 1.4s ease-in-out infinite; }
  tbody.loading input, tbody.loading label { opacity: 0.55; }
  @keyframes rs-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  .skel { display: inline-block; height: 12px; border-radius: 6px; background: #dfe9e3; vertical-align: middle; }
  #save-status.loading::before {
    content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px;
    border: 2px solid #9ab4a5; border-top-color: transparent; border-radius: 50%; animation: rs-spin 0.8s linear infinite;
  }
  @keyframes rs-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { tbody.loading, #save-status.loading::before { animation: none; } }

  .weather {
    max-width: 680px;
    margin: 0 auto 14px;
    padding: 10px 14px 6px;
    background: white;
    border: 1px solid #cbd9d0;
    border-radius: 10px;
  }

  .weather[hidden] { display: none; }

  .weather-summary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 15px;
    flex-wrap: wrap;
  }

  .weather-summary .icon { font-size: 24px; }
  .weather-summary .temps b { font-size: 17px; }
  .weather-summary .rain { color: #2f6fb0; }
  .weather-summary .game { flex-basis: 100%; text-align: center; font-size: 14px; }

  .weather-charts { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  .weather-charts figure { flex: 1 1 240px; margin: 0; }
  .weather-charts figcaption { font-size: 11px; font-weight: 700; color: #5b7066; text-align: center; }
  .weather svg { display: block; width: 100%; height: auto; }
  .weather .credit { text-align: right; font-size: 10px; color: #8a9b92; }
  .weather .credit a { color: inherit; }

  /* Row guard: confirm edits to rows this device doesn't normally set */
  #row-guard { border: 0; padding: 0; border-radius: 14px; background: #fff; color: #243c32;
    box-shadow: 0 12px 40px rgba(0,0,0,.28); max-width: calc(100vw - 32px); }
  #row-guard::backdrop { background: rgba(20,40,32,.35); }
  #row-guard form { padding: 18px 22px 16px; text-align: center; }
  #row-guard p { margin: 0; }
  #row-guard .guard-q { font-size: 18px; font-weight: 700; }
  #row-guard .who { color: #5b7066; margin: 4px 0 14px; }
  #row-guard .buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #row-guard button { font: inherit; font-weight: 600; padding: 8px 14px; min-width: 84px; border-radius: 8px;
    border: 1px solid #9fc7cb; background: #fff; color: #1d6f77; cursor: pointer; }
  #row-guard button.primary { background: #279da8; border-color: #279da8; color: #fff; }
  tr.confirming input[type=text] { background: #fff6d6; }
  .device-rows button { font: inherit; color: #279da8; background: none; border: 0; padding: 0;
    text-decoration: underline; cursor: pointer; }

  @media (max-width: 600px) {
    main { padding: 14px; }
    h1 { font-size: 24px; white-space: nowrap; }
    h1 { gap: 4px; }
    h1 img { height: 28px; }
    .current-date { font-size: 24px; }
    .bottom { grid-template-columns: 1fr !important; gap: 12px; }
    .bottom .count { grid-column: 1; }
    .bottom .notes { grid-column: 1 / -1; margin: 0; }

    .count strong {
      display: inline;
      margin-left: 16px;
    }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1><img src="racket-left.png" alt=""> <span>Racket Science!</span> <img src="racket-right.png" alt=""></h1>
    <p class="current-date" id="current-date"></p>
  </header>

  <section class="weather" id="weather" hidden aria-label="Weather forecast for the game day">
    <div class="weather-summary" id="weather-summary"></div>
    <div class="weather-charts">
      <figure><figcaption>Temperature</figcaption><svg id="weather-temp" viewBox="0 0 270 140" role="img" aria-label="Hourly temperature, 8 AM to 2 PM"></svg></figure>
      <figure><figcaption>Chance of rain</figcaption><svg id="weather-rain" viewBox="0 0 270 140" role="img" aria-label="Hourly chance of rain, 8 AM to 2 PM"></svg></figure>
    </div>
    <div class="credit"></div>
  </section>

  <p class="hint">
    <span id="save-status" role="status">Loading roster…</span> <a href="./" id="reload" hidden>Reload to review</a>
    <span id="device-rows" class="device-rows" hidden></span>
  </p>

  <div class="scroll">
    <table>
      <thead>
        <tr>
          <th scope="col">Player</th>
          <th scope="col">Playing?</th>
          <th scope="col">Comments</th>
        </tr>
      </thead>
      <tbody id="players"></tbody>
    </table>
  </div>

  <section class="bottom">
    <div class="count" aria-live="polite" aria-atomic="true">
      <div class="count-main"><span>Playing:</span> <strong id="count">0</strong></div>
      <small id="possible-count" hidden>Possibly as many as <b id="possible-total"></b></small>
    </div>

    <div class="notes" id="notes-box">
      <label for="notes"><b>Team notes</b></label>
      <textarea id="notes"></textarea>
    </div>
  </section>

  <p class="contacts" id="contacts" hidden>
    <a id="contacts-link" class="bezel" target="_blank" rel="noopener"><span class="gloss"><span>🔒 Player contact info</span></span></a>
    <span class="hint">Opens a Google Sheet; if asked, sign in with the Google account you used for the old web page.</span>
  </p>

  <div class="photos">
    <img src="photos/team-1.jpg" alt="Group photo of the players at the net" loading="lazy">
    <img src="photos/team-2.jpg" alt="Players chatting on court, one holding a dog" loading="lazy">
    <img src="photos/team-3.jpg" alt="Group photo of the players on the bleachers" loading="lazy">
  </div>
</main>

<dialog id="row-guard" aria-labelledby="guard-q">
  <form method="dialog">
    <p class="guard-q" id="guard-q">Edit this row?</p>
    <p class="who"></p>
    <div class="buttons">
      <button value="once" class="primary" autofocus>This time</button>
      <button value="always">Always</button>
      <button value="">Cancel</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
// Google Apps Script web app that reads/writes the Google Sheet (see apps-script/Code.gs)
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyr6TbwhyFmxZU9zAuSnMrDe96HLRzEX6P893l2lY96X1X8SDB8Wyg8X5opUID8k3Pn/exec';
// View-only Google Sheet with names, emails and phones (requires Google sign-in). "" hides the button.
const CONTACTS_URL = 'https://docs.google.com/spreadsheets/d/1FTM56r6_Ob4R0CPYu6nriw_PxoBFyN6vxbTrPZZoHyQ/edit';
if (CONTACTS_URL) { document.getElementById('contacts-link').href = CONTACTS_URL; document.getElementById('contacts').hidden = false; }
let state, stopped = false;
async function callScript(params) {
  const response = await fetch(SCRIPT_URL + '?' + new URLSearchParams(params), {cache:'no-store'});
  const text = await response.text();
  try { return JSON.parse(text); }
  catch { throw Error('not-json'); }  // e.g. a Google sign-in page instead of data
}
const edits = new Map();
const status = document.getElementById('save-status');
const tbody = document.getElementById('players');
function stop(message) {
  stopped = true;
  status.textContent = message + ' Your unsaved text remains visible; copy it before reloading.';
  document.getElementById('reload').hidden = false;
}
// ── Row guard: each device learns which rows it normally sets; edits to other rows ask first ──
const DEVICE_KEY = 'racketScience.device', CLAIM_AFTER = 3;
let device = null;
try { device = JSON.parse(localStorage.getItem(DEVICE_KEY) || 'null'); } catch {}
if (!device || typeof device !== 'object') device = {};
device.id ||= (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
device.counts ||= {};   // rowId -> {name, n}: unprompted attendance taps while learning
device.mine ||= {};     // rowId -> name: this device's own rows
function saveDevice() { try { localStorage.setItem(DEVICE_KEY, JSON.stringify(device)); } catch {} }
saveDevice();
const deviceRows = document.getElementById('device-rows');
function showDeviceRows() {
  const names = Object.values(device.mine);
  deviceRows.hidden = !names.length;
  if (!names.length) return;
  const forget = Object.assign(document.createElement('button'), {type: 'button', textContent: 'forget'});
  forget.onclick = () => { device.mine = {}; device.counts = {}; saveDevice(); showDeviceRows(); };
  deviceRows.replaceChildren(`· This device's rows: ${names.join(', ')} (`, forget, ')');
}
function pruneDevice() {   // rows shift when players are added or archived: drop anything whose name no longer matches
  const names = new Map(state.players.map(p => [p.id, p.name]));
  for (const id in device.mine) if (names.get(id) !== device.mine[id]) delete device.mine[id];
  for (const id in device.counts) if (names.get(id) !== device.counts[id].name) delete device.counts[id];
  saveDevice(); showDeviceRows();
}
const rowGuarded = p => Object.keys(device.mine).length > 0 && !(p.id in device.mine);
function claimRow(p) { device.mine[p.id] = p.name; saveDevice(); showDeviceRows(); }
function noteRowUse(p) {
  let c = device.counts[p.id];
  if (!c || c.name !== p.name) c = device.counts[p.id] = {name: p.name, n: 0};
  c.n++;
  if (c.n >= CLAIM_AFTER) device.mine[p.id] = p.name;
  saveDevice(); showDeviceRows();
}
const guard = document.getElementById('row-guard');
guard.addEventListener('click', e => { if (e.target === guard) guard.close(''); });  // tap outside = Cancel
function askEdit(player, row) {
  guard.querySelector('.who').textContent = player.name;
  row.classList.add('confirming');
  guard.returnValue = '';
  guard.showModal();
  return new Promise(resolve => guard.addEventListener('close', () => {
    row.classList.remove('confirming'); resolve(guard.returnValue);
  }, {once: true}));
}
function celebrate(r) { if(r.value==='yes')burstConfetti(r);else if(r.value==='no')burstSmoke(r);else if(r.value==='maybe')burstQuestions(r); }

function updateCount() {
  const yes = state.players.filter(p=>p.attendance==='yes').length;
  const maybe = state.players.filter(p=>p.attendance==='maybe').length;
  document.getElementById('count').textContent = yes;
  document.getElementById('possible-count').hidden = !maybe;
  document.getElementById('possible-total').textContent = yes + maybe;
}
function track(target, field, immediate = false) {
  const key = `${target.id || 'team'}:${field}`;
  let edit = edits.get(key);
  if (!edit) {
    edit = { target, field, previous: target[field], desired: target[field], gameDate: state.gameDate };
    edits.set(key, edit);
  }
  return value => {
    if (stopped) return;

// ── Weather forecast for the game date (Open-Meteo, no key needed) ──
const WEATHER_LAT = 37.42, WEATHER_LON = -122.13;   // ZIP 94306, Palo Alto
const GAME_START = 10.5, GAME_END = 12;             // game time, hours (10:30am–noon)
let weatherFor = null, weatherAt = 0;

  :c<=57?['🌦️','Drizzle']:c<=67?['🌧️','Rain']:c<=77?['🌨️','Snow']:c<=82?['🌦️','Showers']:c<=86?['🌨️','Snow showers']:['⛈️','Thunderstorms'];
// ── Weather: National Weather Service first, Open-Meteo as backup ──
// Each source is converted to one shape: {temps[24], rain[24] (null = no data for that hour),
// icon, words, hi, lo, rainMax, source:{name,url}}. 10 s timeout per request, one load at a time,
// retry after 2 min, and fall back to this device's last good forecast for the same game day (< 6 h old).
const WX_CACHE_KEY = 'racketScience.weather2', NWS_GRID_KEY = 'racketScience.nwsGrid';
let weatherBusy = false, weatherRetryAt = 0;

async function fetchJSON(url, opts = {}) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 10000);

  } finally { clearTimeout(timer); }
}
function iconFromWords(t) {
  t = (t || '').toLowerCase();
  if (/thunder/.test(t)) return '⛈️';
  if (/snow|sleet|ice/.test(t)) return '🌨️';
  if (/rain|shower|drizzle/.test(t)) return /chance|slight|light|patchy|isolated/.test(t) ? '🌦️' : '🌧️';
  if (/fog|haze|smoke/.test(t)) return '🌫️';
  if (/mostly cloudy|overcast|^cloudy/.test(t)) return '☁️';
  if (/partly|mostly sunny|mostly clear/.test(t)) return '🌤️';
  return '☀️';
}
function summarize(temps, rain) {
  const tv = temps.filter(v => v != null), rv = rain.filter(v => v != null);
  return {hi: tv.length ? Math.max(...tv) : null, lo: tv.length ? Math.min(...tv) : null, rainMax: rv.length ? Math.max(...rv) : 0};
}

async function fetchNWS(date) {
  const H = {Accept: 'application/geo+json'};
  let grid = null; try { grid = localStorage.getItem(NWS_GRID_KEY); } catch {}
  if (!grid) {                                   // look up the forecast grid for the courts once, then remember it
    const pt = await fetchJSON(`https://api.weather.gov/points/${WEATHER_LAT},${WEATHER_LON}`, {headers: H});
    grid = pt.properties.forecastHourly;
    try { localStorage.setItem(NWS_GRID_KEY, grid); } catch {}
  }
  const j = await fetchJSON(grid, {headers: H});
  const temps = Array(24).fill(null), rain = Array(24).fill(null), words = Array(24).fill(null), wind = Array(24).fill(null), windDir = Array(24).fill(null);
  for (const p of j.properties.periods) {
    if (p.startTime.slice(0, 10) !== date) continue;          // startTime is local time, e.g. 2026-11-13T10:00:00-08:00
    const h = +p.startTime.slice(11, 13);
    temps[h] = p.temperatureUnit === 'C' ? p.temperature * 9/5 + 32 : p.temperature;
    rain[h] = p.probabilityOfPrecipitation?.value ?? 0;
    words[h] = p.shortForecast;
    const mph = String(p.windSpeed || '').match(/\d+/g); if (mph) wind[h] = Math.max(...mph.map(Number));   // "5 to 10 mph" -> 10
    windDir[h] = p.windDirection || null;

  return {temps, rain, wind, windDir, words: gameWords, icon: iconFromWords(gameWords), ...summarize(temps, rain),

}
async function fetchOpenMeteo(date) {
  const q = new URLSearchParams({latitude:WEATHER_LAT, longitude:WEATHER_LON,
    hourly:'temperature_2m,precipitation_probability,wind_speed_10m,wind_direction_10m',
    daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',
    temperature_unit:'fahrenheit', wind_speed_unit:'mph', timezone:'America/Los_Angeles', start_date:date, end_date:date});
  const w = await fetchJSON('https://api.open-meteo.com/v1/forecast?' + q);
  const [icon, words] = WX(w.daily.weather_code[0]);
  const compass = d => d == null ? null : ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d / 22.5) % 16];
  return {temps: w.hourly.temperature_2m, rain: w.hourly.precipitation_probability.map(v => v ?? 0), icon, words,
          wind: (w.hourly.wind_speed_10m || []).map(v => v == null ? null : Math.round(v)), windDir: (w.hourly.wind_direction_10m || []).map(compass),
          hi: w.daily.temperature_2m_max[0], lo: w.daily.temperature_2m_min[0], rainMax: w.daily.precipitation_probability_max[0] ?? 0,
          source: {name: 'Open-Meteo', url: 'https://open-meteo.com/'}};
}

async function loadWeather(date) {
  if (!date || (date === weatherFor && Date.now() - weatherAt < 30*60*1000)) return;
  if (weatherBusy || Date.now() < weatherRetryAt) return;
  const box = document.getElementById('weather');
  const today = new Intl.DateTimeFormat('en-CA', {timeZone:'America/Los_Angeles'}).format(new Date());  // YYYY-MM-DD
  if (date < today) { box.hidden = true; weatherFor = date; weatherAt = Date.now(); return; }  // no "forecast" for a past game
  weatherBusy = true;
  try {
    let n;
    try { n = await fetchNWS(date); }
    catch { try { localStorage.removeItem(NWS_GRID_KEY); } catch {}   // re-look-up the grid next time, in case it moved
            n = await fetchOpenMeteo(date); }                          // backup source
    weatherFor = date; weatherAt = Date.now();
    try { localStorage.setItem(WX_CACHE_KEY, JSON.stringify({date, at: weatherAt, n})); } catch {}
    drawWeather(n, null); box.hidden = false;
  } catch {
    weatherRetryAt = Date.now() + 2*60*1000;                       // both down or slow: try again in 2 minutes
    let c = null; try { c = JSON.parse(localStorage.getItem(WX_CACHE_KEY) || 'null'); } catch {}
    if (c && c.date === date && Date.now() - c.at < 6*60*60*1000) { drawWeather(c.n, c.at); box.hidden = false; }
    else box.hidden = true;

}

function drawWeather(n, savedAt) {
  const {temps, rain} = n, r0 = v => v == null ? '–' : Math.round(v);
  // credit line names the source that actually supplied this forecast
  const credit = document.querySelector('#weather .credit');
  credit.replaceChildren();
  if (savedAt) credit.append('As of ' + new Date(savedAt).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}) + ' · ');
  credit.append('Forecast for Palo Alto (94306) · ');
  const a = Object.assign(document.createElement('a'), {href: n.source.url, target: '_blank', rel: 'noopener', textContent: n.source.name});
  credit.append(a);

  add('icon', n.icon);

  add('temps', `<b>${r0(n.hi)}°</b> / ${r0(n.lo)}°`);
  add('rain', `💧 ${n.rainMax}% chance of rain`);

  const gTemp = temps[11] ?? temps[12] ?? temps[10];
  const wv = [10, 11, 12].map(h => n.wind?.[h]).filter(v => v != null);
  const wd = n.windDir?.[11] || n.windDir?.[10] || n.windDir?.[12] || '';

  if (gHours.length) add('game', `<b>Game time (10:30–noon):</b> ${r0(gTemp)}°, ${Math.max(...gHours.map(h => rain[h]))}% chance of rain${windTxt}`);

  const hrs = []; for (let h = H0; h <= H1; h++) hrs.push(h);

    let g = `<rect x="${x(GAME_START)}" y="${T}" width="${x(GAME_END)-x(GAME_START)}" height="${ph}" fill="#ffd54f" opacity="0.28"/>`
          + `<text x="${(x(GAME_START)+x(GAME_END))/2}" y="${T-3}" font-size="9" text-anchor="middle" fill="#8a6d00">GAME</text>`;
    for (const [y, t] of yLines) g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e8f1eb"/><text x="${L-4}" y="${y+3}" font-size="9" text-anchor="end" fill="#8a9b92">${t}</text>`;
    for (const h of hrs) g += `<line x1="${x(h)}" x2="${x(h)}" y1="${T+ph}" y2="${T+ph+4}" stroke="#9ab4a5"/><text x="${x(h)}" y="${Hh-6}" font-size="9" text-anchor="middle" fill="#5b7066">${lab(h)}</text>`;
    return g + `<line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" stroke="#9ab4a5"/>`;

    p.life++; const t = p.life - p.delay; if (t < 0) continue;
    p.x += p.vx + Math.sin(t/16 + p.phase)*0.55; p.y += p.vy; p.vy *= 0.992; p.r += p.grow * (1 - t/(p.span*1.6));
    const k = Math.min(1, t / p.span), a = p.peak * (k < 0.15 ? k/0.15 : Math.pow(1 - (k-0.15)/0.85, 1.6));
    const grd = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    const c = p.shade;
    grd.addColorStop(0, `rgba(${c},${c},${c+4},${a})`);
    grd.addColorStop(0.55, `rgba(${c},${c},${c+4},${a*0.55})`);
    grd.addColorStop(1, `rgba(${c},${c},${c+4},0)`);
    g.fillStyle = grd; g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI*2); g.fill();
  }
}
// Where to start an effect: the button's centre, measured relative to the effects layer itself.
// (On iPhone the visible window changes height as Safari's address bar shows/hides, so never assume
//  the layer sits at 0,0 with the window's size.)
function effectOrigin(el) {
  const r = el.getBoundingClientRect(), c = confettiCanvas.getBoundingClientRect();
  return {x: r.left + r.width/2 - c.left, y: r.top + r.height/2 - c.top};
}
function tickConfetti() {
  // Match the drawing surface to the layer's actual on-screen size every frame (width AND height),
  // so nothing is stretched when the address bar collapses or expands mid-animation.
  const dpr = devicePixelRatio || 1, box = confettiCanvas.getBoundingClientRect(), W = box.width, H = box.height;
  if (confettiCanvas.width !== Math.round(W*dpr) || confettiCanvas.height !== Math.round(H*dpr)) {
    confettiCanvas.width = Math.round(W*dpr); confettiCanvas.height = Math.round(H*dpr);
  }
  const g = confettiCanvas.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  confetti = confetti.filter(p => p.life < 90 && p.y < H + 20);
  for (const p of confetti) {
    p.life++; p.vy += 0.22; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    g.save(); g.globalAlpha = Math.max(0, 1 - p.life/90); g.translate(p.x, p.y); g.rotate(p.rot);
    g.fillStyle = p.c; g.fillRect(-p.w/2, -p.h/2, p.w, p.h * Math.abs(Math.cos(p.life/6 + p.rot))); g.restore();
  }
  drawSmoke(g); drawQuestions(g);
  if (confetti.length || smoke.length || quest.length) requestAnimationFrame(tickConfetti); else { g.clearRect(0,0,W,H); confettiRunning = false; }
}
